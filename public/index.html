<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- El color de la barra del navegador acompaña al modo. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f3f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171a" />

    <title>codeStatus · HTTP status codes, explained by ducks</title>
    <meta
      name="description"
      content="Every HTTP status code explained with an absurd duck photo."
    />

    <!-- El SVG lo prefieren los navegadores modernos; el .ico queda de respaldo. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Previsualización al compartir el enlace (WhatsApp, Slack, Telegram...).
      og:image tiene que ser una URL absoluta: las rutas que empiezan por / no
      las resuelven, y sin estas etiquetas cada uno se inventa la imagen (era
      lo que hacía que saliera el logo de React).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="codeStatus" />
    <meta property="og:title" content="codeStatus · HTTP status codes, explained by ducks" />
    <meta property="og:description" content="Every HTTP status code explained with an absurd duck photo. 85 codes, including the unofficial ones you only meet behind nginx or Cloudflare." />
    <meta property="og:url" content="https://daniball.github.io/codeStatus/" />
    <meta property="og:image" content="https://daniball.github.io/codeStatus/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="codeStatus: a question mark whose dot is a duck" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="codeStatus · HTTP status codes, explained by ducks" />
    <meta name="twitter:description" content="Every HTTP status code explained with an absurd duck photo." />
    <meta name="twitter:image" content="https://daniball.github.io/codeStatus/og-image.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
