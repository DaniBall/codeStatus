name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permisos que necesita el despliegue oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llegan varios push seguidos, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test -- --watchAll=false
        env:
          CI: true

      # CI=true convierte los avisos de compilación en errores: si algo se
      # cuela, el despliegue se para en vez de publicar una web rota.
      - name: Compilar
        run: npm run build
        env:
          CI: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
